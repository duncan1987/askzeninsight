# Ask Zen Insight - Nginx reverse proxy for Next.js standalone (port 3000)
# Put this at /etc/nginx/sites-available/askzen then symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name zeninsight.xyz www.zeninsight.xyz ask.zeninsight.xyz;  # TODO: replace with your domain

    # Max upload size (admin course/blog editors)
    client_max_body_size 10M;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Upstream response header buffer. Supabase OAuth callback sets
        # chunked session cookies (~8-16KB of Set-Cookie headers), which
        # overflows the default 4K buffer -> nginx 502 "upstream sent too
        # big header". NOTE: on the live server these live in
        # /etc/nginx/conf.d/00-proxy-buffers.conf (http level) so the
        # certbot-managed 443 server block inherits them too.
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # WebSocket support (if ever needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming (AI chat) - do not buffer
        proxy_buffering off;
        proxy_cache off;

        # Long-running streaming responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
