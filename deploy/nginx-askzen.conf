# Ask Zen Insight - Nginx reverse proxy for Next.js standalone (port 3000)
# Put this at /etc/nginx/sites-available/askzen then symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name zeninsight.xyz www.zeninsight.xyz ask.zeninsight.xyz;  # TODO: replace with your domain

    # Max upload size (admin course/blog editors)
    client_max_body_size 10M;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (if ever needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming (AI chat) - do not buffer
        proxy_buffering off;
        proxy_cache off;

        # Long-running streaming responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
